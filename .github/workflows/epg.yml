name: Build EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 获取 iptv-org/epg 抓取器
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git .epg-src
          cd .epg-src
          npm ci --no-audit --no-fund --ignore-scripts
          npm run api:load

      - name: 生成抓取清单
        run: |
          python3 scripts/build_channels.py \
            --m3u "https://iptv-org.github.io/iptv/index.m3u" \
            --epg-repo .epg-src \
            --out build/channels.xml \
            --report build/report.json \
            --max-per-channel 2
          grep -c "<channel " build/channels.xml

      - name: 过滤掉没有抓取配置的站点
        run: |
          cd .epg-src
          python3 - "$GITHUB_WORKSPACE/build/channels.xml" <<'PY'
          import os, re, sys
          path = sys.argv[1]
          kept, dropped = [], 0
          for line in open(path, encoding="utf-8"):
              m = re.search(r'<channel site="([^"]+)"', line)
              if m and not os.path.isfile(f"sites/{m.group(1)}/{m.group(1)}.config.js"):
                  dropped += 1
                  continue
              kept.append(line)
          open(path, "w", encoding="utf-8").writelines(kept)
          print(f"dropped {dropped} channel(s) without config")
          PY

      - name: 补充缺失频道的节目源
        run: |
          python3 - <<'PY'
          p = "build/channels.xml"
          aliases = [
              # Canal+ Sport 5-8：epgshare01 斯洛伐克源（已验证有数据）
              ("epgshare01.online", "SK1#CANAL+.Sport.5.HD.sk", "CanalPlusSport5SK.sk@SD", "sk", "Canal+ Sport 5"),
              ("epgshare01.online", "SK1#CANAL+.Sport.6.HD.sk", "CanalPlusSport6SK.sk@SD", "sk", "Canal+ Sport 6"),
              ("epgshare01.online", "SK1#CANAL+.Sport.7.HD.sk", "CanalPlusSport7SK.sk@SD", "sk", "Canal+ Sport 7"),
              ("epgshare01.online", "SK1#CANAL+.Sport.8.HD.sk", "CanalPlusSport8SK.sk@SD", "sk", "Canal+ Sport 8"),
              # Canal+ Sport 2：两个候选源
              ("epgshare01.online", "CZ1#Canal+.Sport.2.cz", "CanalPlusSport2SK.sk@SD", "sk", "Canal+ Sport 2"),
              ("m.tv.sms.cz", "Canal%2B+Sport+2", "CanalPlusSport2SK.sk@SD", "sk", "Canal+ Sport 2"),
              # Rakuten：改用 Samsung TV Plus 西班牙源
              ("i.mjh.nz", "SamsungTVPlus/es#ES2600004BD", "RakutenTVActionMovies.es@Spain", "es", "Rakuten TV Action Movies"),
              ("i.mjh.nz", "SamsungTVPlus/es#ES2600003UM", "RakutenTVDramaMovies.es@Spain", "es", "Rakuten TV Drama Movies"),
              ("i.mjh.nz", "SamsungTVPlus/gb#GB2600018PD", "RakutenTVTopMovies.es@UK", "en", "Rakuten TV Top Movies UK"),
              # Tennis Channel 2：三个候选源
              ("i.mjh.nz", "Plex/us#5e20b730f2f8d5003d739db7-65944d40cbc51b25e5070a18", "TennisChannel2.us@SD", "en", "Tennis Channel 2"),
              ("plex.tv", "65944d40cbc51b25e5070a18", "TennisChannel2.us@SD", "en", "Tennis Channel 2"),
              ("i.mjh.nz", "Roku/all#a0b7c0bc09955942866e7072266483c8", "TennisChannel2.us@SD", "en", "Tennis Channel 2"),
              # ION Plus：两个候选源
              ("i.mjh.nz", "Plex/us#5e20b730f2f8d5003d739db7-627e347795b0f50af26d78f9", "IONPlus.us@East", "en", "ION Plus"),
              ("i.mjh.nz", "SamsungTVPlus/us#USBD300003LK", "IONPlus.us@East", "en", "ION Plus"),
              # CNN 国际版欧洲
              ("allente.dk", "50024", "CNNInternational.us@Europe", "en", "CNN International"),
          ]
          txt = open(p, encoding="utf-8").read()
          add = "".join(
              f'  <channel site="{s}" lang="{l}" xmltv_id="{x}" site_id="{sid}">{n}</channel>\n'
              for s, sid, x, l, n in aliases
          )
          txt = txt.replace("</channels>", add + "</channels>")
          open(p, "w", encoding="utf-8").write(txt)
          print(f"added {len(aliases)} alias channel(s)")
          PY

      - name: 抓取节目单
        run: |
          cd .epg-src
          set -o pipefail
          npm run grab -- \
            --channels=../build/channels.xml \
            --output=../build/guide.xml \
            --maxConnections=8 \
            --days=3 2>&1 | tee ../build/grab.log

      - name: 抓取日志（失败时也会执行）
        if: always()
        run: |
          echo "===== grab.log 最后 40 行 ====="
          tail -40 build/grab.log 2>/dev/null || echo "没有生成 grab.log"
          ls -lh build/guide.xml 2>/dev/null || echo "没有生成 guide.xml"

      - name: 整理、去重、压缩
        if: success()
        run: |
          python3 scripts/postprocess.py build/guide.xml public/epg.xml \
            --channels build/channels.xml --gzip

      - name: 生成订阅首页
        if: success()
        run: python3 scripts/make_index.py public --report build/report.json

      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: public

      - uses: actions/deploy-pages@v4
        if: success()
